minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

publicHoistPattern:
  - '@intlify/*'

shellEmulator: true

packages:
  - playground
  - docs

overrides:
  magic-regexp: 'workspace:*'
  nuxt: 4.6.4
  vite: 8.3.6
  vue: 3.5.45

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': true
  esbuild: false
  shadcn-docs-nuxt: false
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false
