publicHoistPattern:
  - '@intlify/*'

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

packages:
  - playground
  - docs

overrides:
  magic-regexp: 'link:.'
  nuxt: 4.3.1
  vite: 7.3.6
  vue: 3.5.29

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - shadcn-docs-nuxt
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp
  - simple-git-hooks
